name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribution-editorial.svg?color_snake=#171717&color_dots=#eee9df,#f1c9b5,#eaa083,#e16b50,#dc382b
            dist/contribution-editorial-dark.svg?palette=github-dark&color_snake=#f5ebd3&color_dots=#161b22,#542a27,#884035,#b84c39,#dc382b

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
