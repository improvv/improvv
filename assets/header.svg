<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Hi, I'm Jinjeong">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#d9f5ec"/>
      <stop offset="0.55" stop-color="#e6e4fb"/>
      <stop offset="1" stop-color="#fde4ec"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="260" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="260" fill="url(#bg)"/>

    <!-- soft waves -->
    <path fill="#ffffff" fill-opacity="0.45" d="M0 205 C 200 170, 380 240, 600 205 S 1000 170, 1200 205 V260 H0 Z">
      <animate attributeName="d" dur="7s" repeatCount="indefinite"
        values="M0 205 C 200 170, 380 240, 600 205 S 1000 170, 1200 205 V260 H0 Z;
                M0 200 C 220 235, 400 175, 600 200 S 980 235, 1200 200 V260 H0 Z;
                M0 205 C 200 170, 380 240, 600 205 S 1000 170, 1200 205 V260 H0 Z"/>
    </path>
    <path fill="#b9a7f5" fill-opacity="0.28" d="M0 228 C 240 208, 420 252, 640 228 S 1020 206, 1200 228 V260 H0 Z">
      <animate attributeName="d" dur="5s" repeatCount="indefinite"
        values="M0 228 C 240 208, 420 252, 640 228 S 1020 206, 1200 228 V260 H0 Z;
                M0 232 C 220 250, 440 212, 640 232 S 1000 250, 1200 226 V260 H0 Z;
                M0 228 C 240 208, 420 252, 640 228 S 1020 206, 1200 228 V260 H0 Z"/>
    </path>

    <!-- floating bubbles -->
    <g fill="#ffffff" fill-opacity="0.8">
      <circle cx="90" cy="60" r="7"><animate attributeName="cy" values="60;48;60" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="1100" cy="70" r="10"><animate attributeName="cy" values="70;56;70" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="1040" cy="150" r="5"><animate attributeName="cy" values="150;140;150" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="170" cy="170" r="5"><animate attributeName="cy" values="170;160;170" dur="4.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- sparkles -->
    <g fill="#b9a7f5">
      <path d="M230 52 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z">
        <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <path d="M960 190 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
    <g fill="#f5a3bf">
      <path d="M1000 42 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/>
      </path>
      <path d="M140 118 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 z">
        <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- text -->
    <g text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
      <text x="600" y="98" font-size="22" font-weight="600" fill="#6b7a8f" letter-spacing="1">Hi there, I'm</text>
      <text x="600" y="152" font-size="54" font-weight="800" fill="#3b4a5e" letter-spacing="-0.5">Jinjeong</text>
      <text x="600" y="188" font-size="18" fill="#6b7a8f">Computer Engineering @ Hanbat National University</text>
    </g>
  </g>
</svg>
