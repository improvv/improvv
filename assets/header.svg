      <text x="60" y="213" font-size="76" font-weight="750" letter-spacing="-3" fill="#40364f">Jinjeong<tspan fill="#9d88c6">.</tspan></text>
      <text x="66" y="258" font-size="20" fill="#70647f">Computer vision, thoughtful apps,</text>
      <text x="66" y="288" font-size="20" fill="#70647f">and a little curiosity.</text>
